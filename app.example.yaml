# App Engine Standard config. Copy to app.yaml (gitignored, because it holds secrets) and fill in the values:
#   cp app.example.yaml app.yaml
runtime: nodejs22
instance_class: F1 # smallest instance, covered by the free tier

automatic_scaling:
  min_instances: 0 # scale to zero when idle (free); first request after idle takes a few seconds
  max_instances: 1 # never more than one instance, so we stay inside the free tier

env_variables:
  MCP_BEARER_TOKEN: "change-me" # e.g. openssl rand -hex 32
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
  PAYSTACK_SECRET_KEY: "sk_test_..." # test keys only; the server refuses anything else
  PUBLIC_BASE_URL: "https://your-project-id.REGION_ID.r.appspot.com" # no trailing slash
  # PORT is set by App Engine; don't add it here.
